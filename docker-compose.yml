
services:
  web:
    build: .
    container_name: mountain-coders-web
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - media_data:/app/media

    expose:
      - "8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: mountain-coders-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      web:
        condition: service_healthy

volumes:
  media_data:
