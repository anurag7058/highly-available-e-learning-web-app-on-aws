
name: AWS E-Learning CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: highly-available-e-learning-web-app

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t e-learning-app:${{ github.sha }} .

      - name: Run Django system checks
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY=ci-test-secret-key-not-for-production \
            -e DJANGO_DEBUG=False \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            e-learning-app:${{ github.sha }} \
            python manage.py check

                  - name: Verify AWS configuration
        if: github.event_name == 'push'
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN is empty"
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: AWS_REGION is empty"
            exit 1
          fi

          echo "AWS_ROLE_ARN is configured"
          echo "AWS_REGION is configured"
          echo "AWS account and role:"
          echo "$ROLE_ARN" | sed -E 's#(arn:aws:iam::)[0-9]+(:role/.*)#\1********\2#'
          echo "AWS_REGION=$AWS_REGION"

      - name: Configure AWS credentials using OIDC
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag e-learning-app:${IMAGE_TAG} \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
